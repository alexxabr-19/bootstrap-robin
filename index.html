<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Bootstrap </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <nav >
        <p class="text-center mb-0" style="background-color: #2c3e50;">ESTE ES EL NAVBAR</p>
    </nav>

    <main>
        <section class="bg-azul-claro">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-3 text-center">
                        <img src="./img/avatar.svg" class="img-fluid pt-7" alt="logo">
                    </div>
                </div>
                <div class="row justify-content-center">
                    <div class="col-md-12 text-center">
                        <h2 class="text-white display-2 fw-bold"> START BOOTSTRAP </h2>
                    </div>
                </div>
                <div class="row justify-content-center">
                    <div class="col-md-12 text-center">
                        <img src="./img/estrellaUno.png" alt="estrella" class="pt-2 pb-4">
                    </div>
                </div>
                <div class="row justify-content-center">
                    <div class="col-md-12 text-center">
                        <p class="text-white display-9 pb-7"> Graphic Artist: Web Designer - ILustrator </p>
                    </div>
                </div>
            </div>
        </section>


        <section class="bg-red">
            <div class="container">
                <div class="row mt-4">
                    <div class="col-md-12 text-center">
                        <h2> PORTFOLIO</h2>
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col-md-12 text-center">
                        <img src="./img/estrellaDos.png" alt="estrella">
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col-md-4">
                        <img src="./img/cabin.png" alt="cabin" class="img-fluid">
                    </div>
                    <div class="col-md-4">
                        <img src="./img/cake.png" alt="cabin" class="img-fluid">
                    </div>
                    <div class="col-md-4">
                        <img src="./img/circus.png" alt="cabin" class="img-fluid">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4">
                        <img src="./img/game.png" alt="cabin" class="img-fluid">
                    </div>
                    <div class="col-md-4">
                        <img src="./img/safe.png" alt="cabin" class="img-fluid">
                    </div>
                    <div class="col-md-4">
                        <img src="./img/submarine.png" alt="cabin" class="img-fluid">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"> </script>
</body>

</html>
